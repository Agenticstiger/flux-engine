# The root document. One Simulation describes one run: which world, which
# people, which behaviour, and which FLUID contract the rows are emitted for.
fluxVersion: "0.5.0"
kind: Simulation
id: sim-payment-recovery
name: Payment Recovery Simulation
metadata:
  owner:
    team: growth-lab
spec:
  worldRef: q3-retention-world
  fidelity: deterministic        # same bundle and seed, same bytes, on any machine
  seed: 42
  timeBounds:
    start: "2026-07-01T00:00:00Z"
    end: "2026-09-30T23:59:59Z"
  personaRefs: [persona-pragmatic-family]
  signalRefs: [sig-payment-aborted]
  # Journeys and detectors reach a run only through a module's resources.
  moduleRefs: [module-payment-recovery]
  emits:
    - productRef: telco.gold.payment_recovery_moment
      exposeId: payment_recovery_moment
      fluidVersion: "^0.7.3"
      provenance:
        # The digest of payment-recovery.fluid.yml. The engine refuses to run when the
        # contract moves away from the one this simulation was written against, and
        # prints the new digest so you can copy it in on purpose.
        contractDigest: "sha256:b9b5ee575a8b313f6f72d039653d8be5d76e7ecc0012d7bd6ad2d37e0e60435d"
