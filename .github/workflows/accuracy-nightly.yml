name: Accuracy

# The accuracy program (docs/accuracy/DESIGN.md), in two tiers.
#
#   pull request, push to main
#       `Accuracy (PR tier)`: every family at fixed seeds and small sizes, so
#       a red result is a change in the code, never a roll of the dice.
#
#   schedule (daily), workflow_dispatch, or the act of labelling a pull
#   request `accuracy-nightly` / `accuracy-weekly`
#       The nightly tier at fresh seeds and full sizes, PractRand, the
#       determinism matrix on Linux, benchmarks, and one joined artefact
#       (`flux-accuracy-nightly/1`) with the report page rendered from it.
#       On Mondays (UTC), on `accuracy-weekly`, or on dispatch with
#       `weekly`, it adds the macOS determinism cells and mutation testing.
#       macOS runs weekly, not nightly.
#
# One cron, not two: the weekly extras key on the day of the week computed
# in the `seed` job, so a Monday is one run, not a nightly and a weekly run
# racing each other for the same commit.
#
# A label starts the nightly tier once, on the `labeled` event itself. Later
# pushes to the pull request run the pull-request tier only; to measure new
# code at nightly size, remove the label and add it again. Keying on the
# label's presence instead would re-run the heavy tiers -- macOS, mutmut --
# on every push for as long as the label stayed on.
#
# CI installs with pip from the version ranges in pyproject.toml, as ci.yml
# does, so the program measures the dependencies a user's `pip install`
# resolves today; uv.lock pins a developer's environment. The determinism
# matrix pins NumPy per cell on purpose.
#
# No `paths-ignore`, for the reason ci.yml gives: a check that never runs
# reads exactly like a passing one.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Nightly base seed (empty draws a fresh one)"
        required: false
        default: ""
      weekly:
        description: "Also run the macOS determinism cells and mutation testing"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    # Naming bash is what turns on `-o pipefail` (see ci.yml).
    shell: bash

env:
  # A missing sibling FLUX checkout fails a pytest job instead of skipping
  # it, as in ci.yml. FLUX_ACCURACY_REQUIRED is set per job, only in the
  # jobs that install the accuracy group: a determinism cell installs
  # `.[dev]` alone and collects the whole tree for `make test-vectors`,
  # where the accuracy modules must skip, not fail.
  FLUX_EXAMPLES_REQUIRED: "1"
  PYTHONUNBUFFERED: "1"
  BIN: ""
  # PractRand pre-0.95, public domain. The archive is pinned by its sha256
  # (observed 2026-11-11), so a changed file on the mirror fails the job
  # instead of running unreviewed code.
  PRACTRAND_URL: "https://downloads.sourceforge.net/project/pracrand/PractRand-pre0.95.zip"
  PRACTRAND_SHA256: "5738c322ccb983b63fbe693f305afa2a7c73e64a80b303c9139278c453ce27b4"

concurrency:
  # The label name is part of the key, so labelling a pull request for any
  # other reason starts a run of its own instead of cancelling a nightly run
  # in progress.
  group: accuracy-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.label.name || 'none' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------ PR tier
  pr-tier:
    name: Accuracy (PR tier)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLUX_ACCURACY_REQUIRED: "1"
    defaults:
      run:
        working-directory: flux-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: flux-engine
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Agenticstiger/FLUX
          path: FLUX
          token: ${{ secrets.FLUX_SPEC_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flux-engine/pyproject.toml
      - name: Install flux_engine with the accuracy group
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --group accuracy
      - name: Accuracy program, pull-request tier
        run: pytest tests/accuracy -n auto --dist loadscope -p no:cacheprovider

  # ---------------------------------------------------- nightly: the seed
  seed:
    name: Nightly seed
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.action == 'labeled'
          && (github.event.label.name == 'accuracy-nightly'
              || github.event.label.name == 'accuracy-weekly'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_seed: ${{ steps.seed.outputs.base_seed }}
      confirm_seed: ${{ steps.seed.outputs.confirm_seed }}
      weekly: ${{ steps.seed.outputs.weekly }}
      date: ${{ steps.seed.outputs.date }}
    steps:
      - id: seed
        env:
          REQUESTED: ${{ inputs.seed }}
          WEEKLY_INPUT: ${{ inputs.weekly }}
          WEEKLY_LABEL: ${{ github.event.label.name == 'accuracy-weekly' }}
        run: |
          if [[ -n "${REQUESTED}" ]]; then
            [[ "${REQUESTED}" =~ ^[0-9]+$ ]] || { echo "seed must be a non-negative integer" >&2; exit 1; }
            seed="${REQUESTED}"
          else
            seed="$(python3 -c 'import secrets; print(secrets.randbits(63))')"
          fi
          weekly=false
          if [[ "$(date -u +%u)" == "1" && "${GITHUB_EVENT_NAME}" == "schedule" ]]; then weekly=true; fi
          if [[ "${WEEKLY_INPUT}" == "true" || "${WEEKLY_LABEL}" == "true" ]]; then weekly=true; fi
          # The confirmation pass re-runs a first-pass failure at a second
          # fresh seed; every seed below it is derived through sha256, so
          # base + 1 gives unrelated draws.
          confirm="$(SEED="${seed}" python3 -c 'import os; print((int(os.environ["SEED"]) + 1) % (1 << 63))')"
          {
            echo "base_seed=${seed}"
            echo "confirm_seed=${confirm}"
            echo "weekly=${weekly}"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"
          echo "Nightly base seed: ${seed} (weekly extras: ${weekly})" >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------- nightly: accuracy and speed
  nightly:
    name: Accuracy (nightly tier)
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: flux-engine
    env:
      FLUX_ACCURACY_REQUIRED: "1"
      FLUX_ACCURACY_TIER: nightly
      FLUX_ACCURACY_SEED: ${{ needs.seed.outputs.base_seed }}
      FLUX_ACCURACY_RESULTS_DIR: ${{ github.workspace }}/out/results
      FLUX_ACCURACY_COUNTEREXAMPLES: ${{ github.workspace }}/out/counterexamples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: flux-engine
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Agenticstiger/FLUX
          path: FLUX
          token: ${{ secrets.FLUX_SPEC_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flux-engine/pyproject.toml
      - name: Install flux_engine with the accuracy group
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --group accuracy
          mkdir -p "${GITHUB_WORKSPACE}/out"
      # About sixteen batteries at q = 0.01 each give a correct engine a
      # first-pass rejection on about one night in six. A failure is
      # therefore re-run once at a second fresh seed, and only a failure the
      # confirmation repeats turns the night red (DESIGN.md, "Controlling
      # false alarms"). pytest's own --last-failed picks what to re-run.
      - name: Accuracy program, nightly tier
        id: first
        run: |
          set +e
          pytest tests/accuracy -n auto --dist loadscope \
            -o cache_dir="${GITHUB_WORKSPACE}/out/.pytest_cache" \
            --junitxml="${GITHUB_WORKSPACE}/out/junit.xml"
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Confirm first-pass failures at a second fresh seed
        id: confirm
        if: steps.first.outputs.status != '0'
        env:
          FLUX_ACCURACY_SEED: ${{ needs.seed.outputs.confirm_seed }}
          FLUX_ACCURACY_RESULTS_DIR: ${{ github.workspace }}/out/confirm-results
        run: |
          set +e
          pytest tests/accuracy --last-failed --last-failed-no-failures none \
            -n auto --dist loadscope \
            -o cache_dir="${GITHUB_WORKSPACE}/out/.pytest_cache" \
            --junitxml="${GITHUB_WORKSPACE}/out/confirm-junit.xml"
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: The nightly tier's outcome
        if: steps.first.outputs.status != '0' && steps.confirm.outputs.status != '0'
        run: |
          echo "a first-pass failure was not cleared at the confirmation seed" >&2
          exit 1
      - name: Benchmarks (serial; pytest-benchmark refuses xdist)
        if: always()
        env:
          FLUX_ACCURACY_BENCH: "1"
        run: >-
          pytest tests/accuracy/bench -p no:xdist -p no:cacheprovider -q
          --benchmark-json="${GITHUB_WORKSPACE}/out/bench.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: accuracy-nightly
          path: out/
          if-no-files-found: error
          # A re-run of a failed job uploads again into the same run.
          overwrite: true

  # --------------------------------------------------- nightly: PractRand
  practrand:
    name: PractRand (sibling streams)
    needs: seed
    runs-on: ubuntu-latest
    # The first-words feed took 40 and 69 minutes on two runs of the same
    # commit, so its step gets 120 and the job 180. A timeout fails the night
    # with no finding in it, and the confirmation pass cannot clear a job.
    timeout-minutes: 180
    defaults:
      run:
        working-directory: flux-engine
    env:
      FLUX_ACCURACY_TIER: nightly
      FLUX_ACCURACY_SEED: ${{ needs.seed.outputs.base_seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: flux-engine
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flux-engine/pyproject.toml
      - name: Install flux_engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build PractRand from the pinned archive
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o practrand.zip "${PRACTRAND_URL}"
          echo "${PRACTRAND_SHA256}  practrand.zip" | sha256sum -c -
          mkdir practrand
          cd practrand
          unzip -q ../practrand.zip
          g++ -std=c++14 -O3 -Iinclude -pthread -c src/*.cpp src/RNGs/*.cpp src/RNGs/other/*.cpp
          ar rcs libPractRand.a ./*.o
          g++ -std=c++14 -O3 -Iinclude -pthread -o RNG_test tools/RNG_test.cpp libPractRand.a
          echo "PRACTRAND_RNG_TEST=${PWD}/RNG_test" >> "$GITHUB_ENV"
      - name: PractRand, first words of sibling streams (2^30 bytes)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/out"
          python -m tests.accuracy.streams.practrand run --mode first-words --bytes 1073741824 \
            --rng-test "${PRACTRAND_RNG_TEST}" --workers "$(nproc)" --timeout-seconds 7200 \
            --out "${GITHUB_WORKSPACE}/out/practrand-first-words.json"
      - name: PractRand, interleaved sibling streams (2^30 bytes)
        if: always()
        run: |
          python -m tests.accuracy.streams.practrand run --mode interleave --bytes 1073741824 \
            --rng-test "${PRACTRAND_RNG_TEST}" --timeout-seconds 2400 \
            --out "${GITHUB_WORKSPACE}/out/practrand-interleave.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: accuracy-practrand
          path: out/
          if-no-files-found: error
          # A re-run of a failed job uploads again into the same run.
          overwrite: true

  # ---------------------------------------- nightly: determinism matrix
  # Every cell writes a manifest of digests under the night's fresh seeds;
  # `determinism-compare` requires them to be byte-identical. The cells at
  # the NumPy floor also run the pinned digest set: ci.yml already runs it
  # on every pull request at the latest NumPy (Linux 3.11-3.13, macOS 3.12)
  # and weekly on all six cells, so repeating it at the latest NumPy here
  # would buy nothing. The floor is pyproject's `numpy>=1.26`, raised to the
  # first release with wheels for the interpreter.
  determinism:
    name: Determinism (${{ matrix.os }}, Python ${{ matrix.py }}, NumPy ${{ matrix.numpy }})
    needs: seed
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: flux-engine
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(needs.seed.outputs.weekly == 'true'
          && '[{"os":"ubuntu-latest","py":"3.11","numpy":"1.26.0"},{"os":"ubuntu-latest","py":"3.11","numpy":"latest"},{"os":"ubuntu-latest","py":"3.12","numpy":"1.26.0"},{"os":"ubuntu-latest","py":"3.12","numpy":"latest"},{"os":"ubuntu-latest","py":"3.13","numpy":"2.1.0"},{"os":"ubuntu-latest","py":"3.13","numpy":"latest"},{"os":"macos-latest","py":"3.11","numpy":"1.26.0"},{"os":"macos-latest","py":"3.11","numpy":"latest"},{"os":"macos-latest","py":"3.12","numpy":"1.26.0"},{"os":"macos-latest","py":"3.12","numpy":"latest"},{"os":"macos-latest","py":"3.13","numpy":"2.1.0"},{"os":"macos-latest","py":"3.13","numpy":"latest"}]'
          || '[{"os":"ubuntu-latest","py":"3.11","numpy":"1.26.0"},{"os":"ubuntu-latest","py":"3.11","numpy":"latest"},{"os":"ubuntu-latest","py":"3.12","numpy":"1.26.0"},{"os":"ubuntu-latest","py":"3.12","numpy":"latest"},{"os":"ubuntu-latest","py":"3.13","numpy":"2.1.0"},{"os":"ubuntu-latest","py":"3.13","numpy":"latest"}]') }}
    env:
      FLUX_ACCURACY_TIER: nightly
      FLUX_ACCURACY_SEED: ${{ needs.seed.outputs.base_seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: flux-engine
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Agenticstiger/FLUX
          path: FLUX
          token: ${{ secrets.FLUX_SPEC_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.py }}
          cache: pip
          cache-dependency-path: flux-engine/pyproject.toml
      - name: Install flux_engine, NumPy ${{ matrix.numpy }}
        env:
          NUMPY: ${{ matrix.numpy }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [[ "${NUMPY}" != "latest" ]]; then pip install "numpy==${NUMPY}"; fi
          python -c "import numpy; print('numpy', numpy.__version__)"
      # make test-digests runs tests/golden, whose towers set reads the FLUX
      # checkout's example: validate it with the flux_spec from that same
      # checkout, as ci.yml's test cells do (see the comment there).
      - name: Install flux_spec from the sibling FLUX checkout
        run: pip install --no-deps ../FLUX
      - name: Pinned digest set (NumPy floor cells)
        if: matrix.numpy != 'latest'
        run: |
          make test-digests
          make test-vectors
      - name: Fresh-seed manifest
        if: always()
        env:
          CELL: ${{ matrix.os }}-py${{ matrix.py }}-numpy${{ matrix.numpy }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/out"
          python -m tests.accuracy.determinism.manifest --seed "${FLUX_ACCURACY_SEED}" \
            --out "${GITHUB_WORKSPACE}/out/manifest-${CELL}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: accuracy-determinism-${{ matrix.os }}-py${{ matrix.py }}-numpy${{ matrix.numpy }}
          path: out/
          if-no-files-found: error
          # A re-run of a failed job uploads again into the same run.
          overwrite: true

  determinism-compare:
    name: Determinism (all cells agree)
    needs: [seed, determinism]
    if: always() && needs.seed.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flux-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: flux-engine
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: accuracy-determinism-*
          path: ${{ github.workspace }}/manifests
          merge-multiple: true
      - name: Compare every cell's manifest
        env:
          # The matrix size: every cell must have written its manifest, so a
          # cell that crashed before writing one fails here instead of
          # dropping out of the comparison.
          EXPECTED: ${{ needs.seed.outputs.weekly == 'true' && '12' || '6' }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/out"
          shopt -s nullglob
          manifests=("${GITHUB_WORKSPACE}"/manifests/manifest-*.json)
          python -m tests.accuracy.determinism.compare --expect "${EXPECTED}" "${manifests[@]}" \
            | tee "${GITHUB_WORKSPACE}/out/determinism-compare.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: accuracy-determinism-compare
          path: out/
          if-no-files-found: error
          # A re-run of a failed job uploads again into the same run.
          overwrite: true

  # ------------------------------------------- weekly: mutation testing
  mutation:
    name: Mutation testing (kernel numerics)
    needs: seed
    if: needs.seed.outputs.weekly == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: flux-engine
    env:
      # mutmut runs the suite from a copy under mutants/, where the sibling
      # FLUX checkout is not beside it; the example-bound tests skip there.
      FLUX_EXAMPLES_REQUIRED: "0"
      FLUX_ACCURACY_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: flux-engine
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flux-engine/pyproject.toml
      - name: Install flux_engine with the accuracy and mutation groups
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --group accuracy --group mutation
      - name: mutmut run
        run: mutmut run --max-children "$(nproc)"
      - name: Export the score
        if: always()
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/out"
          mutmut export-cicd-stats
          cp mutants/mutmut-cicd-stats.json "${GITHUB_WORKSPACE}/out/mutation.json"
          mutmut results --all true > "${GITHUB_WORKSPACE}/out/mutation-results.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: accuracy-mutation
          path: out/
          if-no-files-found: error
          # A re-run of a failed job uploads again into the same run.
          overwrite: true

  # --------------------------------------- the joined artefact and page
  artefact:
    name: Accuracy artefact and report
    # `determinism` itself, not only the compare job: a cell that fails its
    # pinned digest set still uploads its manifest, so the compare job can
    # pass while the cell failed, and the verdict must see the cell.
    needs: [seed, nightly, practrand, determinism, determinism-compare, mutation]
    if: always() && needs.seed.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flux-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: flux-engine
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flux-engine/pyproject.toml
      - name: Install flux_engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: accuracy-*
          path: ${{ github.workspace }}/parts
      - name: Join the artefact and render the page
        env:
          BASE_SEED: ${{ needs.seed.outputs.base_seed }}
          CONFIRM_SEED: ${{ needs.seed.outputs.confirm_seed }}
          RUN_DATE: ${{ needs.seed.outputs.date }}
          WEEKLY: ${{ needs.seed.outputs.weekly }}
          JOBS: ${{ toJSON(needs) }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/out"
          python -m tests.accuracy.tools.artefact \
            --parts "${GITHUB_WORKSPACE}/parts" \
            --base-seed "${BASE_SEED}" --confirm-seed "${CONFIRM_SEED}" \
            --date "${RUN_DATE}" --weekly "${WEEKLY}" \
            --commit "${GITHUB_SHA}" --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jobs "${JOBS}" --baseline docs/accuracy/latest.json \
            --out "${GITHUB_WORKSPACE}/out/accuracy-nightly.json"
          python -m tests.accuracy.report.render \
            --artefact "${GITHUB_WORKSPACE}/out/accuracy-nightly.json" \
            --out "${GITHUB_WORKSPACE}/out/REPORT.md"
          cat "${GITHUB_WORKSPACE}/out/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: accuracy-nightly-${{ needs.seed.outputs.date }}
          path: out/
          if-no-files-found: error
          # A re-run of a failed job uploads again into the same run.
          overwrite: true
      - name: The night's verdict
        run: python -m tests.accuracy.tools.artefact --verdict "${GITHUB_WORKSPACE}/out/accuracy-nightly.json"
