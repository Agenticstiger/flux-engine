name: CI

# Every pull request is built, whatever its base branch. The old
# `pull_request: branches: [main]` filter meant a stacked pull request, one
# whose base is another open branch, triggered no run at all, and an empty
# check list on a pull request reads exactly like a passing one.
#
# No `paths-ignore` filter anywhere, on purpose: a required status check that
# never runs stays pending forever, so path filters and required checks do not
# mix.
#
# There is deliberately NO `tags:` filter under `push`. This file used to
# carry `tags: ["v*"]`, which meant a tag started the six-cell matrix
# natively. .github/workflows/release.yml now triggers on that tag and calls
# this file through `workflow_call` below, so restoring the filter would give
# one tag TWO independent six-cell runs. The matrix still reads the tag: a
# called workflow runs at the caller's ref, so
# `startsWith(github.ref, 'refs/tags/v')` is true inside the call.
on:
  push:
    branches: [main]
  pull_request:
  schedule:  # the only schedule in this file, now that the pin-drift alert is gone
    # Mondays 04:17 UTC. This is what wakes the six-cell whole-suite matrix.
    # Runtime dependencies are range-pinned (numpy>=1.26,<3, pydantic>=2.7,<3,
    # cryptography>=42), so the resolved set drifts under an unchanged commit
    # and only a schedule catches that class of regression at all.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run the whole suite, slow included, on all six operating-system x Python cells."
        type: boolean
        default: false
  # Exposed so that a release workflow can call this file with full_matrix:
  # true, and a release then cannot be built on a commit the six-cell matrix
  # has not run against.
  #
  # This input HAS a caller now: the `ci` job in
  # .github/workflows/release.yml, which `needs`-depends the build job on it,
  # so a red cell means no artifact is built and no release is published. It
  # was the hook; it is now the guarantee. The `tags:` filter that used to sit
  # under `push` above was deleted in the same change, so the call is the only
  # way a tag reaches this matrix.
  workflow_call:
    inputs:
      full_matrix:
        description: "Run the whole suite, slow included, on all six operating-system x Python cells."
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    # Naming bash explicitly is what turns on `-o pipefail`. The implicit
    # default is `bash -e`, where a failing command on the left of a pipe is
    # masked by a succeeding command on the right.
    shell: bash

env:
  # Set once, for every job in this file, including any job added later.
  #
  # A missing sibling FLUX checkout must FAIL a pytest job, never skip it. CI
  # once ran green with 226 tests silently skipped, covering the whole
  # real-binary six-step acceptance path, the public evidence-archive verify
  # and tamper tests, the public golden regression and the runtime telco
  # end-to-end, because thirteen skipif gates key on `../FLUX` and CI checked
  # out only this repository. The coverage gate still passed, because coverage
  # is measured over what ran. Declaring the flag at workflow level rather
  # than per job means a pytest job added later cannot reopen that hole by
  # omission.
  FLUX_EXAMPLES_REQUIRED: "1"
  # Unbuffered output, so a step's log is complete when a job is cancelled or
  # hits its timeout rather than losing the last buffered block.
  PYTHONUNBUFFERED: "1"
  # The Makefile's tool prefix. It defaults to `.venv/bin/` for a developer;
  # CI installs into the runner's own interpreter, so an empty value resolves
  # every tool on PATH. GNU Make's `?=` does not override a variable that is
  # already defined in the environment, and an empty environment value counts
  # as defined (verified on GNU Make 3.81). If that override ever failed to
  # apply, the recipe would invoke a `.venv/bin/...` path that does not exist
  # on a runner and the step would fail loudly rather than skip quietly.
  BIN: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only a pull request cancels its own older run. Pushes to main, tags and the
  # scheduled matrix run to completion: main's run is the record of what
  # merged, and cancelling it leaves a merge unverified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --------------------------------------------------------------- gates
  # Everything that does not need pytest, once.
  #
  # ruff, black, mypy and lint-imports used to run SEVEN times per CI run,
  # inside all six matrix cells and again in the full-suite job, against one
  # identical commit. Running them once is equivalent for three of the four by
  # configuration: ruff pins target-version = "py311", black pins
  # target-version = ["py311"], mypy pins python_version = "3.12". The fourth,
  # import-linter, analyses an import graph with no interpreter branching in
  # it. mypy is repeated as a four-second step on each full test cell below,
  # because it is the one tool whose verdict can still move with the running
  # interpreter through third-party stub resolution (numpy is range-pinned).
  #
  # This job also absorbs the whole former `register-lint` job, whose
  # 19-second dependency install was 65% of its 29-second runtime; the install
  # happens here anyway for mypy and import-linter.
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flux-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flux-engine

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          # Stated, not inferred. With no requirements.txt in the tree,
          # setup-python silently falls back to hashing **/pyproject.toml, a
          # fallback that lives inside the action, is invisible in this file,
          # and stops applying the day any requirements.txt appears anywhere
          # in the repository.
          cache-dependency-path: flux-engine/pyproject.toml

      - name: Install flux_engine (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Every check below is a `make` target. That is what keeps
      # `make ci-local` honest: a check CI runs and ci-local does not cannot
      # be added here without adding the target. The steps in this file that
      # are not `make` targets are setup and plumbing rather than checks:
      # installing the dev extras, asserting the sibling checkout is on disk,
      # printing the runner width, and the `CI gate` aggregation itself.
      # scripts/ is inside the lint paths because scripts/register_lint.py is
      # itself a merge gate, and lint scope is the paths you pass.
      - name: Lint (ruff)
        run: make lint

      - name: Format (black --check)
        run: make format-check

      - name: Types (mypy)
        run: make typecheck

      - name: Import hygiene (import-linter)
        run: make imports

      - name: Register-discipline lint (README / docs / --help)
        run: make register-lint

      # The positive side of the same discipline. register_lint.py bans a fixed
      # vocabulary; this checks the names we DO use are the canonical ones.
      # --self-test runs first because a corrupt registry must fail loudly
      # rather than quietly bless the tree.
      - name: Product Guardrail (terminology)
        run: make guardrail

      # Every file states its licence and copyright holder: a short header
      # in each source file, REUSE.toml for the rest. reuse-tool is a dev extra.
      - name: Licence headers (reuse lint)
        run: make reuse

      # Exit code AND content. Both smoke steps used to gate on exit code
      # alone, so truncated or malformed output would have passed.
      - name: fluxsim describe --self --json
        run: make describe

      - name: fluxsim gate conform (RFC-04 vectors)
        run: make gate-conform

  # ---------------------------------------------------------------- test
  # The operating-system x interpreter matrix, in two shapes.
  #
  #   pull request, push to main
  #       ubuntu 3.11 / 3.12 / 3.13 run the fast subset; macOS 3.12 runs the
  #       determinism set. The other macOS cells wait for the shape below.
  #
  #   schedule, v* tag, dispatch or release call with full_matrix
  #       all six cells run the fast subset AND the slow subset. This is the
  #       release-grade shape; the release workflow's build job needs it, so a
  #       red cell means no artifact is built.
  #
  # EVERY cell of BOTH shapes runs the pinned-digest set. The old pipeline did
  # not, and this is the hole that mattered most: the matrix cells ran
  # `-m "not slow"`, and `pytest -m "not slow" tests/golden` collects nothing
  # ("no tests collected (15 deselected)"; tests/acceptance the same, 17
  # deselected), so the byte-for-byte digest baselines only ever ran in the one
  # ubuntu 3.12 full-suite job. Determinism across operating system and
  # interpreter was a product claim with no cross-platform test behind it.
  #
  # The macOS determinism cell is pinned to 3.12 on purpose: ubuntu already
  # varies the interpreter across 3.11/3.12/3.13 with the same digest set, so
  # holding 3.12 constant here means a macOS mismatch isolates the operating
  # system rather than the interpreter.
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.py }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flux-engine
    strategy:
      fail-fast: false
      matrix:
        # A malformed expression here fails the whole workflow parse, which
        # means the required `CI gate` check is never reported and the pull
        # request cannot merge. That is the fail-closed direction.
        include: >-
          ${{ (github.event.schedule == '17 4 * * 1'
          || startsWith(github.ref, 'refs/tags/v')
          || inputs.full_matrix)
          && fromJSON('[{"os":"ubuntu-latest","py":"3.11","suite":"full","slow":true},{"os":"ubuntu-latest","py":"3.12","suite":"full","cov":true},{"os":"ubuntu-latest","py":"3.13","suite":"full","slow":true},{"os":"macos-latest","py":"3.11","suite":"full","slow":true},{"os":"macos-latest","py":"3.12","suite":"full","slow":true},{"os":"macos-latest","py":"3.13","suite":"full","slow":true}]')
          || fromJSON('[{"os":"ubuntu-latest","py":"3.11","suite":"full"},{"os":"ubuntu-latest","py":"3.12","suite":"full","cov":true},{"os":"ubuntu-latest","py":"3.13","suite":"full"},{"os":"macos-latest","py":"3.12","suite":"digests"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flux-engine

      # The sibling FLUX specification repository, checked out BESIDE this one,
      # because thirteen skipif gates key on it. See the workflow-level
      # FLUX_EXAMPLES_REQUIRED comment for what its absence once cost.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Agenticstiger/FLUX
          path: FLUX
          token: ${{ secrets.FLUX_SPEC_REPO_TOKEN || github.token }}
          # The FLUX checkout is installed and run below, so its token is not
          # left in FLUX/.git/config for that code to read; nothing here pushes.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.py }}
          cache: pip
          cache-dependency-path: flux-engine/pyproject.toml

      - name: Install flux_engine (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The specification package from the sibling checkout, over the PyPI
      # release the dev install pulled in. This job reads its example bundles
      # from FLUX main, so the validator that checks them comes from the same
      # commit: an example that needs a newer schema than the released
      # flux-spec (the towers bundle pins FLUID 0.7.6) would otherwise fail
      # here until the next spec release. --no-deps keeps every dependency at
      # the version the engine pins, and flux_engine.spec still refuses a
      # flux_spec outside SUPPORTED_SPEC_VERSION_RANGE. That refusal couples
      # these cells to FLUX main: the change that moves FLUX main's package
      # version out of that range turns them red here until the engine widens
      # the range, which is the point -- it is the first engine build that would
      # run against that specification.
      - name: Install flux_spec from the sibling FLUX checkout
        run: pip install --no-deps ../FLUX

      # Fail in two seconds on a checkout misconfiguration, naming the path,
      # rather than in five minutes as a wall of test failures.
      - name: The sibling FLUX example bundle is on disk
        run: |
          bundle="../FLUX/examples/telco-payment-recovery"
          test -f "$bundle/flux.lock" || {
            echo "sibling FLUX checkout missing: no $bundle/flux.lock"
            exit 1
          }
          echo "sibling FLUX bundle present at $bundle"

      # `-n auto` sizes itself from the runner. Printing the count makes the
      # parallel width a fact in the log instead of an assumption in a plan.
      - name: Runner width
        run: python -c "import os, sys; print(sys.version); print('cpu_count', os.cpu_count())"

      # The one linter whose verdict can move with the interpreter. Four to six
      # seconds. ruff, black and import-linter are pinned to a fixed target by
      # configuration and run once, in `gates`.
      # Ungated on purpose. The old pipeline ran mypy on macOS 3.11, 3.12 and
      # 3.13 on every pull request; gating this on `full` would drop macOS cover
      # entirely on the pull-request path, and the step costs four to six
      # seconds.
      - name: mypy (cross-version confirmation)
        run: make typecheck

      # The fast subset. The coverage floor is enforced on exactly one cell: it
      # is a property of the source, not of the interpreter, and measuring it
      # roughly doubles the run. The flag string and the 70 floor are unchanged
      # from the old pipeline.
      - name: pytest, fast subset
        if: matrix.suite == 'full'
        run: make ${{ matrix.cov && 'test-fast-cov' || 'test-fast' }}

      # The seed-tree, LRM and expression-vector determinism tests. On a `full`
      # cell they already ran inside the fast subset above. They are a separate
      # selection from tests/golden and do NOT overlap it: no test under
      # tests/golden carries the `golden` marker (verified by grep), so the
      # determinism cell needs both selections, not one.
      - name: Determinism vectors (golden marker)
        if: matrix.suite == 'digests'
        run: make test-vectors

      # The pinned baselines: plan.json, run-digest.json, the component
      # digests, the artifact-size baseline and the one-byte differentials.
      # This is the step that turns "same bundle, same digest, on every
      # operating system and interpreter" into a checked claim, so it runs on
      # every cell of every shape.
      - name: Pinned digests and one-byte differentials
        run: make test-digests

      # Release-grade only. Absent from the ubuntu 3.12 cell because the
      # `slow` job below already runs that suite, sharded, on every event.
      - name: pytest, slow subset
        if: matrix.slow
        run: make test-slow

      - name: fluxsim describe --self --json
        run: make describe

      - name: fluxsim gate conform (RFC-04 vectors)
        run: make gate-conform

  # ---------------------------------------------------------------- slow
  # The other half of the suite. `-m slow` and `-m "not slow"` partition the
  # collected tests exactly, so this job plus the ubuntu 3.12 cell above is the
  # whole suite on ubuntu, previously one serialised job whose pytest step was
  # 2261s in one sampled run and 2852s in the other.
  #
  # Two shards, each under `--dist loadscope` so a module's expensive session
  # fixtures build once rather than once per worker they scatter to. The
  # selections are complementary BY CONSTRUCTION, not by an enumerated list:
  #
  #   acceptance  -m slow tests/acceptance, minus test_one_byte.py
  #   rest        -m slow, minus tests/acceptance, minus tests/golden
  #   digests     tests/golden + test_one_byte.py, on every test cell
  #
  # A new slow test anywhere lands in exactly one of the three with no list to
  # update, and the partition guard below checks it every run.
  slow:
    name: Slow suite (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flux-engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: acceptance
            target: test-slow-acceptance
          - shard: rest
            target: test-slow-rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flux-engine

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Agenticstiger/FLUX
          path: FLUX
          token: ${{ secrets.FLUX_SPEC_REPO_TOKEN || github.token }}
          # The FLUX checkout is installed and run below, so its token is not
          # left in FLUX/.git/config for that code to read; nothing here pushes.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flux-engine/pyproject.toml

      - name: Install flux_engine (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The same spec install as the `test` job, for the same reason.
      - name: Install flux_spec from the sibling FLUX checkout
        run: pip install --no-deps ../FLUX

      - name: The sibling FLUX example bundle is on disk
        run: |
          bundle="../FLUX/examples/telco-payment-recovery"
          test -f "$bundle/flux.lock" || {
            echo "sibling FLUX checkout missing: no $bundle/flux.lock"
            exit 1
          }
          echo "sibling FLUX bundle present at $bundle"

      # Compares collected node-id SETS, not exit codes: the three selections
      # must cover the slow marker exactly, with nothing claimed twice and
      # nothing dropped. Run once, on one shard, because it is a property of
      # the selections rather than of either shard.
      - name: Slow selections partition the slow marker
        if: matrix.shard == 'acceptance'
        run: make slow-partition

      - name: pytest, slow shard
        run: make ${{ matrix.target }}

  # ----------------------------------------------------------- packaging
  # Every other job runs from an editable install, where the source tree is on
  # the path and package data is whatever happens to be on disk. This one
  # builds the distribution, installs it into a clean interpreter, and runs the
  # two CLI gates from a directory that is not the source tree, so a broken
  # [tool.setuptools.package-data], specifically the vendored schema/*.json and
  # vectors/*.json that `fluxsim gate conform` reads, fails here rather than in a
  # user's environment.
  packaging:
    name: Packaging (wheel smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flux-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flux-engine

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flux-engine/pyproject.toml

      - name: Build the distribution and smoke-test it from a clean interpreter
        run: make packaging-smoke

  # --------------------------------------------------------------- proof-guard
  # The engine ships the ProofSystem port and the no-op NoProofSystem, nothing that
  # proves anything: proof-system backends are out of scope for this repository
  # (CONTRIBUTING.md). This job fails a pull request that adds one: a ProofSystem
  # implementation other than NoProofSystem, a spikes/ directory, ADR 0007, Rust, Noir
  # or zkVM guest sources, or an import, dependency or module named for a backend.
  #
  # It runs on every event and is one of the jobs `ci-gate` waits for. It is a
  # tripwire, not a lock: a pull request runs its own copy of this file, the Makefile
  # and the script, so a change to any of them needs a maintainer's eye. Its own job
  # with no dependency install: the guard is a standard-library script, so it starts
  # in seconds and does not wait for, or slow down, the Gates job.
  proof-guard:
    name: Proof material
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Proof-system backends are out of scope
        run: make proof-guard

  # ------------------------------------------------------------ lineage-extra
  # Every other job installs the dev extras only, so the OpenLineage client is
  # absent and the real-client tests skip. A fake client that accepts anything
  # once hid a delivery bug here for several releases; this job installs the
  # `lineage` extra and runs the lineage tests (and the describe surface, whose
  # capability list depends on what is installed) against the real package, and
  # type-checks with the client's own annotations in view. The check is the
  # `make lineage-extra` target, which `make ci-local` runs too.
  lineage-extra:
    name: Lineage extra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flux-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flux-engine

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flux-engine/pyproject.toml

      - name: Install flux_engine (dev and lineage extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lineage]"

      - name: Types and the real-client tests (make lineage-extra)
        run: make lineage-extra

  # ------------------------------------------------------------- ci-gate
  # The one required status check on main.
  #
  # A branch-protection context is the job NAME alone, so requiring
  # "Test (ubuntu-latest, Python 3.12, full)" directly means the day someone
  # edits the matrix that context stops being produced and main quietly stops
  # being protected by it. This job's name never changes, and it fails unless
  # every job above reports success. A skipped or cancelled dependency is a
  # failure here, not a pass. Every job it needs runs on every event, so
  # `skipped` never has an innocent explanation.
  ci-gate:
    name: CI gate
    if: always()
    needs: [gates, test, slow, packaging, proof-guard, lineage-extra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS"
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          not_green = {
              name: job["result"]
              for name, job in results.items()
              if job["result"] != "success"
          }
          if not_green:
              sys.exit(f"gate jobs that did not succeed: {not_green}")
          print(f"all {len(results)} gate jobs succeeded")
          PY
