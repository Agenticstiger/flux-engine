name: First run

# The five-minute promise, measured.
#
# On a runner that has nothing of ours but `uv`, this builds the wheel and then
# does what a newcomer is told to do, through `uvx`, from a directory that is
# not this checkout and with an empty uv cache:
#
#     uvx --from <wheel> fluxsim init demo
#     cd demo
#     uvx --from <wheel> fluxsim run . --verify --ship -o out
#
# It checks that an evidence pack came out and says what it does not prove, then
# records the time to first success in the job summary and as a JSON artifact.
# `make first-run` is the same check on a developer's machine.
#
# Linux runs on every pull request and every push to main. macOS runs weekly and
# on demand only: it bills at ten times the Linux rate while this repository is
# private. When the repository is public, add macOS to the pull-request shape in
# the matrix below.
#
# This is not one of the jobs `CI gate` in ci.yml waits for, on purpose. It needs
# the network (PyPI, and GitHub for `flux-spec`, which is fetched from git until
# it is on PyPI), so a flaky download should show up here as a red check rather
# than hold up an unrelated merge. Require it once `flux-spec` is on PyPI.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 05:41 UTC, after the weekly matrix in ci.yml (04:17).
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  first-run:
    name: First run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && fromJSON('[{"os":"ubuntu-latest"},{"os":"macos-latest"}]')
          || fromJSON('[{"os":"ubuntu-latest"}]') }}
    defaults:
      run:
        shell: bash
    env:
      # The Makefile's tool prefix; empty so `python` resolves on PATH, as in ci.yml.
      BIN: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # `uv` is the one thing a newcomer is assumed to have. Pinned, so a uv
      # release cannot move the number this job records.
      - name: Install uv
        run: python -m pip install --quiet "uv==0.11.23"

      - name: Time to first success
        run: make first-run

      - name: Keep the timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-run-${{ matrix.os }}
          path: build/first-run/first-run.json
          if-no-files-found: warn
