name: Bug report
description: Something does not work the way the documentation says it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If you think this is a security problem, please do
        not open an issue: follow the [security policy](https://github.com/Agenticstiger/flux-engine/blob/main/SECURITY.md) instead.

  - type: input
    id: version
    attributes:
      label: Engine version
      description: 'Output of `python -c "import flux_engine; print(flux_engine.__version__)"`.'
      placeholder: "0.3.1"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: "Output of `python --version`."
      placeholder: "3.12.7"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        The exact commands, and a minimal bundle if the bug needs one. Please use
        synthetic data only; never attach real records.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output or error message
      description: Paste the full text, not a screenshot.
      render: text
