fluidVersion: "0.7.7"
kind: DataProduct
id: retail.billing_dates
name: Billing dates
metadata:
  owner:
    team: billing
exposes:
  - exposeId: customer
    kind: table
    binding:
      platform: aws
      format: glue_table
      location: { database: retail, table: customer, region: eu-west-1 }
    contract:
      schema:
        - { name: cu_id, type: STRING, required: true }
        - { name: cu_start, type: DATE, required: true }
        - { name: cu_end, type: DATE, required: false }
        - { name: cu_score, type: INT, required: false }
    semantics:
      entities:
        - { name: customer, type: primary, expr: cu_id }
  - exposeId: account
    kind: table
    binding:
      platform: aws
      format: glue_table
      location: { database: retail, table: account, region: eu-west-1 }
    contract:
      schema:
        - { name: a_id, type: STRING, required: true }
        - { name: a_customer, type: STRING, required: true }
        - { name: a_open, type: DATE, required: true }
        - { name: a_close, type: DATE, required: false }
        - { name: a_limit, type: INT, required: false }
    semantics:
      entities:
        - { name: account, type: primary, expr: a_id }
      relationships:
        - name: customer
          to: customer
          fromColumns: [a_customer]
          toColumns: [cu_id]
          cardinality: many_to_one
  - exposeId: invoice
    kind: table
    binding:
      platform: aws
      format: glue_table
      location: { database: retail, table: invoice, region: eu-west-1 }
    contract:
      schema:
        - { name: i_id, type: STRING, required: true }
        - { name: i_account, type: STRING, required: true }
        - { name: i_issued, type: TIMESTAMP, required: true }
        - { name: i_amount, type: INT, required: false }
    semantics:
      entities:
        - { name: invoice, type: primary, expr: i_id }
      relationships:
        - name: account
          to: account
          fromColumns: [i_account]
          toColumns: [a_id]
          cardinality: many_to_one
  - exposeId: payment
    kind: table
    binding:
      platform: aws
      format: glue_table
      location: { database: retail, table: payment, region: eu-west-1 }
    contract:
      schema:
        - { name: p_id, type: STRING, required: true }
        - { name: p_invoice, type: STRING, required: true }
        - { name: p_paid, type: TIMESTAMP, required: true }
        - { name: p_amount, type: INT, required: false }
    semantics:
      entities:
        - { name: payment, type: primary, expr: p_id }
      relationships:
        - name: invoice
          to: invoice
          fromColumns: [p_invoice]
          toColumns: [i_id]
          cardinality: many_to_one
