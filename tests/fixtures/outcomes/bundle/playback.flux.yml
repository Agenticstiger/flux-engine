fluxVersion: 0.5.0
kind: Playback
id: pb-renewal
name: Renewal Playback
metadata:
  owner:
    team: billing
spec:
  worldRef: world-telco.silver.subscriptions
  sourceStream: kafka://billing.events.v1
  personaMapping:
  - behaviorPattern: late_payment_count >= 2
    mapToPersona: persona-basic
  calibration:
    targets:
    - population.lifecycleMix
    window: P90D
    method: mle
  drift:
    metric: psi
    threshold: 0.2
    onBreach: warn
  scorecard:
    backtestWindow: P90D
    grade: B
    intervalCoverage: 0.92
    credibility: 0.78
