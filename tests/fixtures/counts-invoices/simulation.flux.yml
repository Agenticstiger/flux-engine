# An account, an invoice header and its lines. The invoices are counted per account that is not
# closed (exactly a fifth are closed, by exact allocation) and the lines per invoice. The header's total,
# line_count and max_qty are contract aggregates of its lines. tests/stages/test_counts_invoice_book_e2e.py runs this bundle through the CLI.
fluxVersion: "0.5.0"
kind: Simulation
id: sim-sales
name: Invoice Book
metadata:
  owner:
    team: sales
spec:
  worldRef: world-sales
  fidelity: deterministic
  seed: 42
  timeBounds:
    start: "2026-07-01T00:00:00Z"
    end: "2026-09-30T23:59:59Z"
  personaRefs: [persona-sales]
  emits:
    - productRef: retail.invoice_book
      exposeId: account
      fluidVersion: "0.7.7"
      provenance: { contractDigest: "sha256:9ccad82cd26ee53e343403e2a30ac58f1204c528df72571540cf39bb6755652c" }
    - productRef: retail.invoice_book
      exposeId: invoice
      fluidVersion: "0.7.7"
      provenance: { contractDigest: "sha256:9ccad82cd26ee53e343403e2a30ac58f1204c528df72571540cf39bb6755652c" }
    - productRef: retail.invoice_book
      exposeId: invoice_line
      fluidVersion: "0.7.7"
      provenance: { contractDigest: "sha256:9ccad82cd26ee53e343403e2a30ac58f1204c528df72571540cf39bb6755652c" }
extensions:
  com.agentics.flux/1:
    counts:
      - emit: invoice
        relationship: account
        minChildren: 1
        parentWhen: "status <> 'closed'"
        children: { levels: ["3", "5", "7"], levelWeights: ["0.25", "0.5", "0.25"] }
      - emit: invoice_line
        relationship: invoice
        minChildren: 1
        children: { levels: ["1", "3", "6"], levelWeights: ["0.4", "0.4", "0.2"] }
    emits:
      account:
        rows: 300
        fidelity:
          encoding: { fractionalBits: 16, rounding: floor }
          records: { min: 1, max: 1000000 }
          columns:
            account_id: { range: { min: '1', max: '300' } }
            segment: { levels: { retail: '0.6', trade: '0.3', public: '0.1' } }
            status: { levels: { active: '0.8', closed: '0.2' }, allocation: exact }
          properties:
            - property: mean
              column: account_id
              tolerance: { type: absolute, value: "1000" }
          budget: { maxChecksPerState: 20, maxStateAge: P30D }
          failureAction: withholdBundle
      invoice:
        rows: 1200
        fidelity:
          encoding: { fractionalBits: 16, rounding: floor }
          records: { min: 1, max: 1000000 }
          columns:
            invoice_id: { range: { min: '1', max: '1200' } }
            status: { levels: { paid: '0.7', open: '0.25', void: '0.05' } }
            issued_on: { range: { min: '2026-07-01', max: '2026-09-30' } }
          properties:
            - property: mean
              column: invoice_id
              tolerance: { type: absolute, value: "1000" }
          budget: { maxChecksPerState: 20, maxStateAge: P30D }
          failureAction: withholdBundle
      invoice_line:
        rows: 3360
        fidelity:
          encoding: { fractionalBits: 16, rounding: floor }
          records: { min: 1, max: 1000000 }
          columns:
            line_id: { range: { min: '1', max: '3360' } }
            quantity: { range: { min: '1', max: '10' } }
            amount: { range: { min: '1', max: '900' } }
          properties:
            - property: mean
              column: amount
              tolerance: { type: absolute, value: "1000" }
          budget: { maxChecksPerState: 20, maxStateAge: P30D }
          failureAction: withholdBundle
