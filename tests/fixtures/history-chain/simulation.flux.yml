# tests/fixtures/versioned with a history on subscription_version: 60 subscriptions of 200 versions
# under 50 customers, chained by nextStart before 2025-12-31. tests/stages/test_history_run.py runs it
# through plan, apply and verify.
fluxVersion: "0.5.0"
kind: Simulation
id: sim-subscriptions
name: Subscriptions
metadata:
  owner:
    team: subscriptions
spec:
  worldRef: world-subscriptions
  fidelity: deterministic
  seed: 42
  timeBounds:
    start: "2023-01-01T00:00:00Z"
    end: "2026-01-01T00:00:00Z"
  personaRefs: [persona-subscriptions]
  emits:
    - productRef: billing.subscriptions
      exposeId: customer
      fluidVersion: "0.7.7"
      provenance: { contractDigest: "sha256:221eb9a322807255ae15c0c76f70b0ca2bb3c71c4b424266886db49635778ab7" }
    - productRef: billing.subscriptions
      exposeId: subscription_version
      fluidVersion: "0.7.7"
      provenance: { contractDigest: "sha256:221eb9a322807255ae15c0c76f70b0ca2bb3c71c4b424266886db49635778ab7" }
    - productRef: billing.subscriptions
      exposeId: invoice
      fluidVersion: "0.7.7"
      provenance: { contractDigest: "sha256:221eb9a322807255ae15c0c76f70b0ca2bb3c71c4b424266886db49635778ab7" }
    - productRef: billing.subscriptions
      exposeId: subscription_current
      fluidVersion: "0.7.7"
      provenance: { contractDigest: "sha256:221eb9a322807255ae15c0c76f70b0ca2bb3c71c4b424266886db49635778ab7" }
    - productRef: billing.subscriptions
      exposeId: subscription_change
      fluidVersion: "0.7.7"
      provenance: { contractDigest: "sha256:221eb9a322807255ae15c0c76f70b0ca2bb3c71c4b424266886db49635778ab7" }
    - productRef: billing.subscriptions
      exposeId: subscription_month
      fluidVersion: "0.7.7"
      provenance: { contractDigest: "sha256:221eb9a322807255ae15c0c76f70b0ca2bb3c71c4b424266886db49635778ab7" }
extensions:
  com.agentics.flux/1:
    history:
      - emit: subscription_version
        entities: 60
        parent: { relationship: customer, minChildren: 1 }
        versions: { bins: ["1", "2", "4", "9"], binWeights: ["0.45", "0.35", "0.20"] }
        start: { bins: ["2023-01-01", "2024-01-01", "2025-07-01"], binWeights: ["0.55", "0.45"] }
        length: { bins: ["30", "90", "365", "1096"], binWeights: ["0.30", "0.45", "0.25"], closed: lower }
        until: "2025-12-31"
        chain: nextStart
    emits:
      customer:
        rows: 50
        fidelity:
          encoding: { fractionalBits: 16, rounding: floor }
          records: { min: 1, max: 1000000 }
          columns:
            customer_id: { range: { min: '1', max: '50' } }
            region: { levels: { eu: '0.6', us: '0.4' } }
            signed_up_on: { range: { min: '2023-01-01', max: '2025-12-31' } }
          properties:
            - property: mean
              column: customer_id
              tolerance: { type: absolute, value: "1000" }
          budget: { maxChecksPerState: 20, maxStateAge: P30D }
          failureAction: withholdBundle
      subscription_version:
        rows: 200
        fidelity:
          encoding: { fractionalBits: 16, rounding: floor }
          records: { min: 1, max: 1000000 }
          columns:
            subscription_sk: { range: { min: '1', max: '200' } }
            subscription_id: { range: { min: '1', max: '200' } }
            valid_from: { range: { min: '2023-01-01', max: '2025-12-31' } }
            valid_to: { range: { min: '2023-01-01', max: '2025-12-31' } }
            plan: { levels: { basic: '0.5', pro: '0.3', team: '0.2' } }
            status: { levels: { active: '0.8', cancelled: '0.2' } }
            started_on: { range: { min: '2023-01-01', max: '2025-12-31' } }
          properties:
            - property: mean
              column: subscription_sk
              tolerance: { type: absolute, value: "1000" }
          budget: { maxChecksPerState: 20, maxStateAge: P30D }
          failureAction: withholdBundle
      invoice:
        rows: 600
        fidelity:
          encoding: { fractionalBits: 16, rounding: floor }
          records: { min: 1, max: 1000000 }
          columns:
            invoice_id: { range: { min: '1', max: '600' } }
            subscription_id: { range: { min: '1', max: '200' } }
            invoice_date: { range: { min: '2023-01-01', max: '2025-12-31' } }
            amount: { range: { min: '5', max: '500' } }
          properties:
            - property: mean
              column: amount
              tolerance: { type: absolute, value: "1000" }
          budget: { maxChecksPerState: 20, maxStateAge: P30D }
          failureAction: withholdBundle
      subscription_current:
        rows: 120
        fidelity:
          encoding: { fractionalBits: 16, rounding: floor }
          records: { min: 1, max: 1000000 }
          columns:
            subscription_id: { range: { min: '1', max: '200' } }
            plan: { levels: { basic: '0.5', pro: '0.3', team: '0.2' } }
            status: { levels: { active: '0.8', cancelled: '0.2' } }
            started_on: { range: { min: '2023-01-01', max: '2025-12-31' } }
          properties:
            - property: mean
              column: subscription_id
              tolerance: { type: absolute, value: "1000" }
          budget: { maxChecksPerState: 20, maxStateAge: P30D }
          failureAction: withholdBundle
      subscription_change:
        rows: 300
        fidelity:
          encoding: { fractionalBits: 16, rounding: floor }
          records: { min: 1, max: 1000000 }
          columns:
            event_id: { range: { min: '1', max: '300' } }
            subscription_id: { range: { min: '1', max: '200' } }
            op: { levels: { c: '0.3', u: '0.6', d: '0.1' } }
            changed_at: { range: { min: '2023-01-01', max: '2025-12-31' } }
            recorded_at: { range: { min: '2023-01-01', max: '2025-12-31' } }
            before_plan: { levels: { basic: '0.5', pro: '0.3', team: '0.2' } }
            after_plan: { levels: { basic: '0.5', pro: '0.3', team: '0.2' } }
          properties:
            - property: mean
              column: event_id
              tolerance: { type: absolute, value: "1000" }
          budget: { maxChecksPerState: 20, maxStateAge: P30D }
          failureAction: withholdBundle
      subscription_month:
        rows: 400
        fidelity:
          encoding: { fractionalBits: 16, rounding: floor }
          records: { min: 1, max: 1000000 }
          columns:
            period_id: { range: { min: '1', max: '400' } }
            subscription_id: { range: { min: '1', max: '200' } }
            month: { range: { min: '2023-01-01', max: '2025-12-31' } }
            plan: { levels: { basic: '0.5', pro: '0.3', team: '0.2' } }
          properties:
            - property: mean
              column: period_id
              tolerance: { type: absolute, value: "1000" }
          budget: { maxChecksPerState: 20, maxStateAge: P30D }
          failureAction: withholdBundle
