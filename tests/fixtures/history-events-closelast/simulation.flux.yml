        - '0.45'
      length:
        bins:
        - '200'
        - '400'
        - '1000'
        binWeights:
        - '0.7'
        - '0.3'
        closed: lower
      until: '2025-12-31'
      chain: nextStart
      tracked:
      - column: plan
        transitions:
          basic:
            pro: '0.6'
            team: '0.4'
          pro:
            basic: '0.5'
            team: '0.5'
          team:
            basic: '0.5'
            pro: '0.5'
      end:
