          v1:
            v2: '0.7'
            v3: '0.3'
          v2:
            v1: '0.5'
            v3: '0.5'
          v3:
            v1: '0.5'
            v2: '0.5'
      end:
        mode: closeLast
        share: '0.3'
        column: status
        value: retired
    asOf:
