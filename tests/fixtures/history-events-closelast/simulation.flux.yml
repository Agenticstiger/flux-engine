          levels:
          - '0'
          - '1'
          - '3'
          levelWeights:
          - '0.2'
          - '0.5'
          - '0.3'
        when: valid_from < DATE '2024-06-01'
        overrides:
          kind: old
      - count: 1
        when: valid_from >= DATE '2024-06-01' AND month >= DATE '2024-01-01'
        overrides:
          kind: new
    - emit: device_week
      of: device_version
      column: week
      grain: week
      match: end
