# tests/fixtures/history-fleet with contract derives on its two projected emits and kinds on its
# periods: vehicle_month and vehicle_change declare derives that read the cells the projection sets
# (the period column, a column of the version, a kind's override, an event's op, its instants and
# its after image). The history ends in its final version for a quarter of its entities and the
# events carry a lag. Each projected row's derives run after the projection sets its cells, so
# verify holds every rule line at 100 %. tests/golden/projected-rules pins its run, and
# tests/stages/test_projected_rules_run.py builds the same bundle.
fluxVersion: 0.5.0
kind: Simulation
id: sim-fleet
name: Fleet
metadata:
  owner:
    team: fleet
spec:
  worldRef: world-fleet
  fidelity: deterministic
  seed: 42
  timeBounds:
    start: '2023-01-01T00:00:00Z'
    end: '2026-01-01T00:00:00Z'
  personaRefs:
  - persona-fleet
  emits:
  - productRef: fleet.vehicles
    exposeId: depot
    fluidVersion: 0.7.7
    provenance:
      contractDigest: sha256:947e2a821bfe96575b9af3cefae5a78c83570e2a47a6123ce4a8dc9d76ae4c44
  - productRef: fleet.vehicles
    exposeId: vehicle_version
    fluidVersion: 0.7.7
    provenance:
      contractDigest: sha256:947e2a821bfe96575b9af3cefae5a78c83570e2a47a6123ce4a8dc9d76ae4c44
  - productRef: fleet.vehicles
    exposeId: service_visit
    fluidVersion: 0.7.7
    provenance:
      contractDigest: sha256:947e2a821bfe96575b9af3cefae5a78c83570e2a47a6123ce4a8dc9d76ae4c44
  - productRef: fleet.vehicles
    exposeId: vehicle_current
    fluidVersion: 0.7.7
    provenance:
      contractDigest: sha256:947e2a821bfe96575b9af3cefae5a78c83570e2a47a6123ce4a8dc9d76ae4c44
  - productRef: fleet.vehicles
    exposeId: vehicle_change
    fluidVersion: 0.7.7
    provenance:
      contractDigest: sha256:947e2a821bfe96575b9af3cefae5a78c83570e2a47a6123ce4a8dc9d76ae4c44
  - productRef: fleet.vehicles
    exposeId: vehicle_month
    fluidVersion: 0.7.7
    provenance:
      contractDigest: sha256:947e2a821bfe96575b9af3cefae5a78c83570e2a47a6123ce4a8dc9d76ae4c44
extensions:
  com.agentics.flux/1:
    history:
    - emit: vehicle_version
      entities: 60
      parent:
        relationship: depot
        minChildren: 1
      versions:
        bins:
        - '1'
        - '2'
        - '4'
        - '9'
        binWeights:
        - '0.45'
        - '0.35'
        - '0.20'
      start:
        bins:
        - '2023-01-01'
        - '2024-01-01'
        - '2025-07-01'
        binWeights:
        - '0.55'
        - '0.45'
      length:
        bins:
        - '30'
        - '90'
        - '365'
        - '1096'
        binWeights:
        - '0.30'
        - '0.45'
        - '0.25'
        closed: lower
      until: '2025-12-31'
      chain: nextStart
      end:
        mode: finalVersion
        share: '0.25'
        column: status
        value: retired
    snapshots:
    - emit: vehicle_current
      of: vehicle_version
    events:
    - emit: vehicle_change
      of: vehicle_version
      at: changed_at
      date: recorded_at
      op: op
      before:
        before_model: model
      after:
        after_model: model
      lag:
        bins:
        - '0'
        - '3'
        - '30'
        binWeights:
        - '0.6'
        - '0.4'
    periods:
    - emit: vehicle_month
      of: vehicle_version
      column: month
      grain: month
      match: overlap
      kinds:
      - count: 1
        when: valid_from < DATE '2024-06-01'
        overrides:
          model: legacy
      - count: 2
        when: valid_from >= DATE '2024-06-01'
    emits:
      depot:
        rows: 50
        fidelity:
          encoding:
            fractionalBits: 16
            rounding: floor
          records:
            min: 1
            max: 1000000
          columns:
            depot_id:
              range:
                min: '1'
                max: '50'
            region:
              levels:
                eu: '0.6'
                us: '0.4'
            opened_on:
              range:
                min: '2023-01-01'
                max: '2025-12-31'
            closed_on:
              range:
                min: '2023-01-01'
                max: '2025-12-31'
          properties:
          - property: mean
            column: depot_id
            tolerance:
              type: absolute
              value: '1000'
          budget:
            maxChecksPerState: 20
            maxStateAge: P30D
          failureAction: withholdBundle
      vehicle_version:
        rows: 200
        fidelity:
          encoding:
            fractionalBits: 16
            rounding: floor
          records:
            min: 1
            max: 1000000
          columns:
            vehicle_sk:
              range:
                min: '1'
                max: '200'
            vehicle_id:
              range:
                min: '1'
                max: '200'
            valid_from:
              range:
                min: '2023-01-01'
                max: '2025-12-31'
            valid_to:
              range:
                min: '2023-01-01'
                max: '2025-12-31'
            model:
              levels:
                sedan: '0.5'
                van: '0.3'
                truck: '0.2'
            status: &id001
              levels:
                active: '0.7'
                maintenance: '0.3'
                retired: '0'
            commissioned_on:
              range:
                min: '2023-01-01'
                max: '2025-12-31'
          properties:
          - property: mean
            column: vehicle_sk
            tolerance:
              type: absolute
              value: '1000'
          budget:
            maxChecksPerState: 20
            maxStateAge: P30D
          failureAction: withholdBundle
      service_visit:
        rows: 600
        fidelity:
          encoding:
            fractionalBits: 16
            rounding: floor
          records:
            min: 1
            max: 1000000
          columns:
            visit_id:
              range:
                min: '1'
                max: '600'
            vehicle_id:
              range:
                min: '1'
                max: '200'
            visited_on:
              range:
                min: '2023-01-01'
                max: '2025-12-31'
            cost:
              range:
                min: '5'
                max: '500'
          properties:
          - property: mean
            column: cost
            tolerance:
              type: absolute
              value: '1000'
          budget:
            maxChecksPerState: 20
            maxStateAge: P30D
          failureAction: withholdBundle
      vehicle_current:
        fidelity:
          encoding:
            fractionalBits: 16
            rounding: floor
          records:
            min: 1
            max: 1000000
          columns:
            vehicle_id:
              range:
                min: '1'
                max: '200'
            model:
              levels:
                sedan: '0.5'
                van: '0.3'
                truck: '0.2'
            status: *id001
            commissioned_on:
              range:
                min: '2023-01-01'
                max: '2025-12-31'
          properties:
          - property: mean
            column: vehicle_id
            tolerance:
              type: absolute
              value: '1000'
          budget:
            maxChecksPerState: 20
            maxStateAge: P30D
          failureAction: withholdBundle
      vehicle_change:
        fidelity:
          encoding:
            fractionalBits: 16
            rounding: floor
          records:
            min: 1
            max: 1000000
          columns:
            event_id:
              range:
                min: '1'
                max: '1000000000'
            vehicle_id:
              range:
                min: '1'
                max: '200'
            op:
              levels:
                c: '1'
            changed_at:
              range:
                min: '2023-01-01'
                max: '2025-12-31'
            recorded_at:
              range:
                min: '2023-01-01'
                max: '2025-12-31'
            before_model:
              levels:
                sedan: '0.5'
                van: '0.3'
                truck: '0.2'
            after_model:
              levels:
                sedan: '0.5'
                van: '0.3'
                truck: '0.2'
          properties:
          - property: mean
            column: event_id
            tolerance:
              type: absolute
              value: '1000000000'
          budget:
            maxChecksPerState: 20
            maxStateAge: P30D
          failureAction: withholdBundle
      vehicle_month:
        fidelity:
          encoding:
            fractionalBits: 16
            rounding: floor
          records:
            min: 1
            max: 1000000
          columns:
            period_id:
              range:
                min: '1'
                max: '1000000000'
            vehicle_id:
              range:
                min: '1'
                max: '200'
            month:
              range:
                min: '2023-01-01'
                max: '2025-12-31'
            model:
              levels:
                sedan: '0.5'
                van: '0.3'
                truck: '0.2'
          properties:
          - property: mean
            column: period_id
            tolerance:
              type: absolute
              value: '1000000000'
          budget:
            maxChecksPerState: 20
            maxStateAge: P30D
          failureAction: withholdBundle
